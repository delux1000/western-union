<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WU Admin · secure</title>
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0b0e17;
      color: #f0f4ff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s;
    }

    /* ---------- LOADING OVERLAY (5sec) ---------- */
    #loadingOverlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(11, 14, 23, 0.85);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 1.5rem;
      animation: fadeIn 0.25s ease;
    }

    #loadingOverlay.active {
      display: flex;
    }

    .loader-ring {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 6px solid rgba(102, 126, 234, 0.15);
      border-top: 6px solid #667eea;
      animation: spin 0.9s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      box-shadow: 0 0 25px rgba(102, 126, 234, 0.3);
    }

    .loader-text {
      font-size: 1.3rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      color: #c7d2fe;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .loader-text i {
      color: #667eea;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* ---------- LOGIN CARD ---------- */
    #loginBox {
      background: rgba(18, 26, 40, 0.8);
      backdrop-filter: blur(12px);
      padding: 3rem 2.8rem;
      border-radius: 40px;
      border: 1px solid rgba(102, 126, 234, 0.25);
      box-shadow: 0 30px 60px rgba(0,0,0,0.6);
      width: 100%;
      max-width: 420px;
      transition: all 0.3s;
      text-align: center;
    }

    #loginBox h2 {
      font-size: 2.2rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #a5b4fc, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }

    #loginBox .sub {
      color: #94a3b8;
      margin-bottom: 2rem;
      font-size: 0.95rem;
      border-bottom: 1px dashed rgba(102,126,234,0.2);
      padding-bottom: 0.8rem;
    }

    .input-group {
      position: relative;
      margin: 1.2rem 0;
    }

    .input-group i {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      font-size: 1.1rem;
    }

    #loginBox input {
      width: 100%;
      padding: 14px 20px 14px 50px;
      border-radius: 60px;
      border: 1px solid rgba(102, 126, 234, 0.2);
      background: rgba(255,255,255,0.06);
      color: white;
      font-size: 1rem;
      transition: all 0.25s;
      outline: none;
    }

    #loginBox input:focus {
      border-color: #667eea;
      background: rgba(255,255,255,0.1);
      box-shadow: 0 0 0 4px rgba(102,126,234,0.2);
    }

    #loginBox input::placeholder {
      color: #64748b;
      font-weight: 300;
    }

    #loginBtn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 60px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      font-weight: 600;
      font-size: 1.1rem;
      cursor: pointer;
      transition: 0.25s;
      margin-top: 0.8rem;
      letter-spacing: 0.3px;
      box-shadow: 0 8px 24px rgba(102,126,234,0.25);
    }

    #loginBtn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 32px rgba(102,126,234,0.4);
    }

    #loginBtn:active {
      transform: scale(0.96);
    }

    /* ---------- DASHBOARD ---------- */
    #dashboard {
      display: none;
      width: 100%;
      max-width: 1400px;
      padding: 20px 25px 40px;
      margin: 0 auto;
    }

    .dash-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 30px;
      gap: 15px;
      background: rgba(18, 26, 40, 0.5);
      backdrop-filter: blur(8px);
      padding: 18px 28px;
      border-radius: 60px;
      border: 1px solid rgba(102,126,234,0.15);
    }

    .dash-header h1 {
      font-size: 1.9rem;
      font-weight: 600;
      background: linear-gradient(135deg, #a5b4fc, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .dash-header h1 i {
      font-size: 2rem;
      -webkit-text-fill-color: initial;
      color: #667eea;
    }

    .header-actions {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn-outline {
      background: transparent;
      border: 1px solid rgba(102,126,234,0.4);
      color: #e2e8f0;
      padding: 10px 22px;
      border-radius: 40px;
      font-weight: 500;
      transition: 0.2s;
      cursor: pointer;
      font-size: 0.9rem;
      backdrop-filter: blur(4px);
    }

    .btn-outline:hover {
      background: rgba(102,126,234,0.15);
      border-color: #667eea;
      transform: translateY(-2px);
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #fca5a5;
    }

    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.25);
    }

    .search {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(102,126,234,0.25);
      border-radius: 60px;
      padding: 12px 24px;
      color: white;
      font-size: 0.95rem;
      min-width: 240px;
      transition: 0.25s;
      outline: none;
    }

    .search:focus {
      border-color: #667eea;
      background: rgba(255,255,255,0.08);
      box-shadow: 0 0 0 4px rgba(102,126,234,0.1);
    }

    .search::placeholder {
      color: #64748b;
    }

    /* user cards grid */
    #users {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
      margin-top: 10px;
    }

    .card {
      background: rgba(18, 26, 40, 0.7);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(102,126,234,0.15);
      border-radius: 28px;
      padding: 24px 22px;
      transition: 0.25s ease;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: rgba(102,126,234,0.5);
      box-shadow: 0 16px 40px rgba(0,0,0,0.5);
    }

    .card h3 {
      font-size: 1.3rem;
      font-weight: 600;
      color: #e2e8f0;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card h3 i {
      color: #667eea;
      font-size: 1.1rem;
    }

    .card p {
      color: #cbd5e1;
      font-size: 0.95rem;
      margin: 6px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card p i {
      width: 20px;
      color: #64748b;
    }

    .status-badge {
      display: inline-block;
      padding: 2px 14px;
      border-radius: 40px;
      font-size: 0.75rem;
      font-weight: 600;
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.2);
    }

    .status-badge.inactive {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border-color: rgba(239, 68, 68, 0.2);
    }

    .topics-section {
      margin: 14px 0 10px;
      padding-top: 12px;
      border-top: 1px solid rgba(102,126,234,0.1);
    }

    .topics-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #94a3b8;
      margin-bottom: 8px;
    }

    .topics-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .topic-badge {
      background: rgba(102,126,234,0.12);
      border: 1px solid rgba(102,126,234,0.2);
      border-radius: 40px;
      padding: 4px 14px;
      font-size: 0.75rem;
      font-family: 'Menlo', monospace;
      color: #b9c7f0;
      transition: 0.15s;
    }

    .topic-badge:hover {
      background: rgba(102,126,234,0.25);
      transform: scale(1.02);
    }

    .no-topics {
      color: #64748b;
      font-style: italic;
      font-size: 0.8rem;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }

    .actions button {
      background: rgba(102,126,234,0.08);
      border: 1px solid rgba(102,126,234,0.15);
      color: #e2e8f0;
      padding: 7px 16px;
      border-radius: 40px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .actions button i {
      font-size: 0.75rem;
      color: #818cf8;
    }

    .actions button:hover {
      background: rgba(102,126,234,0.2);
      border-color: #667eea;
      transform: translateY(-2px);
    }

    .actions button:active {
      transform: scale(0.95);
    }

    /* responsive */
    @media (max-width: 640px) {
      #loginBox { padding: 2rem 1.5rem; }
      .dash-header { flex-direction: column; align-items: stretch; border-radius: 32px; }
      .header-actions { justify-content: stretch; }
      .search { min-width: unset; }
    }
  </style>
</head>
<body>

  <!-- 5-SECOND LOADING OVERLAY -->
  <div id="loadingOverlay">
    <div class="loader-ring"></div>
    <div class="loader-text">
      <i class="fas fa-shield-alt"></i> Authenticating&hellip;
    </div>
  </div>

  <!-- LOGIN -->
  <div id="loginBox">
    <h2><i class="fas fa-crown" style="color: #a5b4fc; -webkit-text-fill-color: initial;"></i> Admin</h2>
    <div class="sub">secure access · western union</div>
    <div class="input-group">
      <i class="fas fa-envelope"></i>
      <input id="email" placeholder="admin@wu.com" value="admin@wu.com">
    </div>
    <div class="input-group">
      <i class="fas fa-lock"></i>
      <input id="password" type="password" placeholder="••••••••" value="admin123">
    </div>
    <button id="loginBtn"><i class="fas fa-arrow-right-to-bracket"></i> &nbsp;Login</button>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard">
    <div class="dash-header">
      <h1><i class="fas fa-gem"></i> Dashboard</h1>
      <div class="header-actions">
        <input id="search" class="search" placeholder="🔍 Search users..." onkeyup="filterUsers()">
        <button class="btn-outline btn-danger" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
      </div>
    </div>

    <div id="users"></div>
  </div>

  <script>
    // ----- core state -----
    let allUsers = [];

    // ----- helpers -----
    function escapeHtml(text) {
      if (!text) return '';
      const d = document.createElement('div');
      d.textContent = text;
      return d.innerHTML;
    }

    // ----- loading overlay (exactly 5 sec) -----
    function showLoading(duration = 5000) {
      return new Promise((resolve) => {
        const overlay = document.getElementById('loadingOverlay');
        overlay.classList.add('active');
        setTimeout(() => {
          overlay.classList.remove('active');
          resolve();
        }, duration);
      });
    }

    // ----- login (with 5s loading) -----
    async function login() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!email || !password) {
        alert('Please enter email and password.');
        return;
      }

      // show 5-sec loading
      await showLoading(5000);

      // actual login fetch
      try {
        const res = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (data.success && data.isAdmin) {
          document.getElementById('loginBox').style.display = 'none';
          document.getElementById('dashboard').style.display = 'block';
          loadUsers();
        } else {
          alert(data.message || 'Login failed. Check credentials.');
          // reset login UI
          document.getElementById('loginBox').style.display = 'block';
        }
      } catch (err) {
        alert('Network error. Please try again.');
        console.warn(err);
      }
    }

    // ----- logout -----
    async function logout() {
      await fetch('/logout', { method: 'POST' });
      location.reload();
    }

    // ----- load users (with topics) -----
    async function loadUsers() {
      try {
        const res = await fetch('/api/admin/users');
        const data = await res.json();
        allUsers = data;
        displayUsers(data);
      } catch (e) {
        console.warn('loadUsers error', e);
        alert('Could not load users.');
      }
    }

    // ----- display users (topics from ntfy_topics / ntfyTopics / topics) -----
    function displayUsers(users) {
      const container = document.getElementById('users');
      container.innerHTML = '';

      if (!users || users.length === 0) {
        container.innerHTML = `<div class="card" style="grid-column:1/-1; text-align:center; padding:40px;">✨ No users found</div>`;
        return;
      }

      users.forEach(user => {
        // extract topics (flexible)
        let topics = user.ntfy_topics || user.ntfyTopics || user.topics || [];
        if (!Array.isArray(topics)) topics = [];

        const activeClass = user.active ? '' : 'inactive';
        const statusText = user.active ? 'Active' : 'Disabled';
        const statusIcon = user.active ? 'fa-circle-check' : 'fa-circle-xmark';

        container.innerHTML += `
          <div class="card">
            <h3><i class="fas fa-user-circle"></i> ${escapeHtml(user.fullname || 'Unnamed')}</h3>
            <p><i class="fas fa-envelope"></i> ${escapeHtml(user.email || '—')}</p>
            <p><i class="fas fa-hashtag"></i> ${escapeHtml(user.account_number || 'N/A')}</p>
            <p><i class="fas fa-coins"></i> $${user.balance?.toFixed?.(2) ?? user.balance ?? '0.00'}</p>
            <p>
              <i class="fas fa-power-off"></i>
              <span class="status-badge ${activeClass}"><i class="fas ${statusIcon}"></i> ${statusText}</span>
            </p>

            <div class="topics-section">
              <div class="topics-title"><i class="fas fa-satellite-dish"></i> Ntfy topics</div>
              <div class="topics-list">
                ${topics.length
                  ? topics.map(t => `<span class="topic-badge">${escapeHtml(t)}</span>`).join('')
                  : '<span class="no-topics">— no topics —</span>'
                }
              </div>
            </div>

            <div class="actions">
              <button onclick="credit('${user.email}')"><i class="fas fa-plus-circle"></i> Credit</button>
              <button onclick="debit('${user.email}')"><i class="fas fa-minus-circle"></i> Debit</button>
              <button onclick="toggle('${user.email}')"><i class="fas fa-rotate"></i> Toggle</button>
              <button onclick="changePass('${user.email}')"><i class="fas fa-key"></i> Pass</button>
              <button onclick="message('${user.email}')"><i class="fas fa-message"></i> Msg</button>
            </div>
          </div>
        `;
      });
    }

    // ----- search filter -----
    function filterUsers() {
      const q = document.getElementById('search').value.toLowerCase();
      const filtered = allUsers.filter(u =>
        (u.fullname && u.fullname.toLowerCase().includes(q)) ||
        (u.email && u.email.toLowerCase().includes(q)) ||
        (u.account_number && u.account_number.includes(q))
      );
      displayUsers(filtered);
    }

    // ---------- ACTIONS (with correct credit/debit) ----------
    async function credit(email) {
      const raw = prompt('💰 Enter amount to CREDIT (positive number):');
      if (raw === null) return;
      const amount = parseFloat(raw);
      if (isNaN(amount) || amount <= 0) {
        alert('Please enter a valid positive number.');
        return;
      }
      try {
        const res = await fetch('/api/admin/credit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userEmail: email, amount })
        });
        const data = await res.json();
        if (data.success) {
          alert(`✅ Credited $${amount.toFixed(2)} to ${email}`);
        } else {
          alert(`❌ Credit failed: ${data.message || 'unknown error'}`);
        }
      } catch (e) {
        alert('Network error while crediting.');
      }
      loadUsers();
    }

    async function debit(email) {
      const raw = prompt('💸 Enter amount to DEBIT (positive number):');
      if (raw === null) return;
      const amount = parseFloat(raw);
      if (isNaN(amount) || amount <= 0) {
        alert('Please enter a valid positive number.');
        return;
      }
      try {
        const res = await fetch('/api/admin/debit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userEmail: email, amount })
        });
        const data = await res.json();
        if (data.success) {
          alert(`✅ Debited $${amount.toFixed(2)} from ${email}`);
        } else {
          alert(`❌ Debit failed: ${data.message || 'insufficient balance or error'}`);
        }
      } catch (e) {
        alert('Network error while debiting.');
      }
      loadUsers();
    }

    async function toggle(email) {
      if (!confirm(`Toggle status for ${email}?`)) return;
      try {
        await fetch('/api/admin/toggle-status', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userEmail: email })
        });
        alert('✅ Status toggled.');
      } catch (e) {
        alert('Error toggling status.');
      }
      loadUsers();
    }

    async function changePass(email) {
      const newPass = prompt('🔑 Enter new password:');
      if (!newPass) return;
      try {
        await fetch('/api/admin/change-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userEmail: email, newPassword: newPass })
        });
        alert('✅ Password updated.');
      } catch (e) {
        alert('Error changing password.');
      }
    }

    async function message(email) {
      const msg = prompt('📩 Enter message to send:');
      if (!msg) return;
      try {
        await fetch('/api/admin/send-message', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userEmail: email, message: msg })
        });
        alert('✅ Message sent.');
      } catch (e) {
        alert('Error sending message.');
      }
    }

    // ----- attach login event (with 5s loading) -----
    document.getElementById('loginBtn').addEventListener('click', login);

    // allow Enter key on login inputs
    document.getElementById('email').addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });
    document.getElementById('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });

    // small note: the /login endpoint expects admin credentials, we assume admin@wu.com / admin123 works.
    // if your backend uses different, adjust default values.
    console.log('WU Admin Panel · 5s loading animation on login');
  </script>
</body>
</html>
